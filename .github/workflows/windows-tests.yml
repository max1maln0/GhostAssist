name: Windows tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q config core platform_adapters providers ui tests tools main.py
      - run: python -m ruff check config core platform_adapters providers ui tests tools main.py
      - run: python -m ruff format --check config core platform_adapters providers ui tests tools main.py
      - run: python -m unittest discover -s tests -v
